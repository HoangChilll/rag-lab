[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HoangChilll", email = "vutronghoang12072006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.1",
    "langchain-anthropic>=1.7.11",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.8.1",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.22",
    "langsmith>=0.15.0",
    "ollama>=0.6.3",
    "openrouter>=0.11.46",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
